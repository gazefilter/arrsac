[package]
name = "gazefilter-arrsac"
version = "0.2.0"
edition = "2021"
description = "From the paper \"A Comparative Analysis of RANSAC Techniques Leading to Adaptive Real-Time Random Sample Consensus\""
documentation = "https://docs.rs/gazefilter-arrsac/"
repository = "https://github.com/gazefilter/arrsac"
keywords = ["ransac", "sample", "consensus"]
categories = ["algorithms", "science", "science::robotics", "no-std"]
license = "MIT"
readme = "README.md"

[dependencies]
sample-consensus = "1.0.1"
rand_core = "0.10"

[dev-dependencies]
rand = "0.10"
rand_xoshiro = "0.8"

[profile.dev]
opt-level = 3
